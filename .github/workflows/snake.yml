name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day
  workflow_dispatch:        # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Generate ocean/teal snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: iqragulshaikh
          outputs: |
            dist/ocean-snake.svg?color_snake=%2300B4D8&color_dots=%23CAF0F8,%2390E0EF,%2348CAE4,%230096C7,%230077B6
            dist/ocean-snake-dark.svg?color_snake=%2364FFDA&color_dots=%23112240,%230077B6,%230096C7,%2300B4D8,%2348CAE4

      - name: Push output to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
